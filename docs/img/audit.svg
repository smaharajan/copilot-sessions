  <text x="382" y="22" fill="#8b93a7" font-size="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cs audit</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5">
    <text x="34.2" y="66.0" fill="#00afff" textLength="16.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">──</text>
    <text x="58.5" y="66.0" fill="#e6e6e6" font-weight="600" textLength="243.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Security · 46 sessions scanned</text>
    <text x="309.6" y="66.0" fill="#4e4e4e" textLength="437.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">──────────────────────────────────────────────────────</text>
    <text x="34.2" y="104.0" fill="#ff5f87" font-weight="600" textLength="137.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● ACTION REQUIRED</text>
    <text x="50.4" y="123.0" fill="#e6e6e6" font-weight="600" textLength="672.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1 session needs your action · 1 value pasted by you · 1 hardcoded in a session that</text>
    <text x="50.4" y="142.0" fill="#e6e6e6" font-weight="600" textLength="421.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">wrote files · 1 session reports destroying something</text>
    <text x="50.4" y="161.0" fill="#8a8a8a" textLength="567.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2 findings across 2 sessions. Rotate confirmed live credentials first.</text>
    <text x="34.2" y="199.0" fill="#ff5f87" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▌</text>
    <text x="42.3" y="199.0" fill="#e6e6e6" font-weight="600" textLength="186.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Destructive actions · 3</text>
    <text x="236.7" y="199.0" fill="#4e4e4e" textLength="510.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">───────────────────────────────────────────────────────────────</text>
    <text x="50.4" y="218.0" fill="#8a8a8a" textLength="623.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Read out of the conversation. The store records file creates and edits but no</text>
    <text x="50.4" y="237.0" fill="#8a8a8a" textLength="656.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">deletion, and no command exit code — so nothing here is proof that something ran.</text>
    <text x="50.4" y="275.0" fill="#ff5f87" textLength="40.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    2</text>
    <text x="107.1" y="275.0" fill="#ff5f87" textLength="72.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ran      </text>
    <text x="188.1" y="275.0" fill="#ff5f87" textLength="56.7" lengthAdjust="spacingAndGlyphs" xml:space="preserve">██████▋</text>
    <text x="244.8" y="275.0" fill="#4e4e4e" textLength="24.3" lengthAdjust="spacingAndGlyphs" xml:space="preserve">···</text>
    <text x="277.2" y="275.0" fill="#8a8a8a" textLength="275.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the session reports having done it</text>
    <text x="50.4" y="294.0" fill="#ffaf00" textLength="40.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    1</text>
    <text x="107.1" y="294.0" fill="#ffaf00" textLength="72.9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">proposed </text>
    <text x="188.1" y="294.0" fill="#ffaf00" textLength="32.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">███▍</text>
    <text x="220.5" y="294.0" fill="#4e4e4e" textLength="48.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">······</text>
    <text x="277.2" y="294.0" fill="#8a8a8a" textLength="445.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">offered in a code block; the store cannot say if it ran</text>
    <text x="34.2" y="332.0" fill="#ff5f87" textLength="8.1" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▌</text>
    <text x="42.3" y="332.0" fill="#e6e6e6" font-weight="600" textLength="162.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Reported as done · 2</text>
    <text x="212.4" y="332.0" fill="#4e4e4e" textLength="534.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">──────────────────────────────────────────────────────────────────</text>
    <text x="50.4" y="370.0" fill="#8a8a8a" textLength="421.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">last active  session    turn  seen  what     summary</text>
